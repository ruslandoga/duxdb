name: precompile

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  MIX_ENV: prod
  CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL: "true"
  DUCKDB_VERSION: "1.5.5"

jobs:
  precompile:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            duckdb_asset: libduckdb-osx-universal.zip
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            duckdb_asset: libduckdb-linux-arm64.zip
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
            duckdb_asset: libduckdb-linux-amd64.zip

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Download DuckDB
        run: |
          curl -fL \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}" \
            -o libduckdb.zip
          unzip libduckdb.zip -d libduckdb

      - name: Build artifact
        env:
          DUCK_NIF_CFLAGS: -I${{ github.workspace }}/libduckdb
          DUCK_NIF_LDFLAGS: -L${{ github.workspace }}/libduckdb
          DUCK_NIF_LIB_DIR: ${{ github.workspace }}/libduckdb
          ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache
        run: |
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          mix deps.get
          mix elixir_make.precompile

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cache/duck_nif*.tar.gz
            cache/duck_nif*.sha256

  precompile-musl:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-linux-musl
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            duckdb_asset: libduckdb-linux-arm64-musl.zip
          - target: x86_64-linux-musl
            platform: linux/amd64
            runner: ubuntu-24.04
            duckdb_asset: libduckdb-linux-amd64-musl.zip

    steps:
      - uses: actions/checkout@v7

      - name: Build artifact
        run: |
          mkdir -p cache
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --volume "${{ github.workspace }}:/work" \
            --workdir /work \
            --env MIX_ENV=prod \
            --env CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL=true \
            --env DUCKDB_VERSION="${DUCKDB_VERSION}" \
            hexpm/elixir:1.20.2-erlang-29.0.3-alpine-3.24.1 \
            sh -lc '
              set -eu
              apk add --no-cache build-base curl unzip ca-certificates
              curl -fsSL \
                "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/${{ matrix.duckdb_asset }}" \
                -o /tmp/libduckdb.zip
              unzip -q /tmp/libduckdb.zip -d /tmp/libduckdb
              mix local.hex --force
              mix deps.get
              export DUCK_NIF_CFLAGS=-I/tmp/libduckdb
              export DUCK_NIF_LDFLAGS=-L/tmp/libduckdb
              export DUCK_NIF_LIB_DIR=/tmp/libduckdb
              export ELIXIR_MAKE_CACHE_DIR=/work/cache
              mix elixir_make.precompile
            '

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cache/duck_nif*.tar.gz
            cache/duck_nif*.sha256

  checksums:
    name: checksums
    if: startsWith(github.ref, 'refs/tags/')
    needs: [precompile, precompile-musl]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Generate checksum manifest
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs)

          if [ "${release_version}" != "${project_version}" ]; then
            echo "Tag version ${release_version} does not match project version ${project_version}"
            exit 1
          fi

          mix deps.get
          mix elixir_make.checksum --all

      - name: Commit checksum manifest
        run: |
          if [ -z "$(git status --porcelain -- checksum.exs)" ]; then
            echo "checksum.exs is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checksum.exs
          git commit -m "Add ${GITHUB_REF_NAME} artifact checksums"
          git push origin HEAD:master
